[project]
name = "df12-documentation-skills"
version = "0.1.0"
description = "Canonical documentation skills and their test contracts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cmd-mox",
    "hypothesis>=6",
    "interrogate",
    "pytest",
    "pytest-bdd",
    "pytest-timeout",
    "pyyaml>=6.0.3",
    "ruff",
    "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
    "ty==0.0.56",
    "yamllint",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "D",
    "E",
    "F",
    "FA",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PLR",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
]
extend-ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["too-many-arguments", "magic-value-comparison", "no-self-use", "assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pytest.ini_options]
markers = ["cmd_mox(auto_lifecycle: bool = True): control cmd-mox lifecycle"]
testpaths = ["tests"]
timeout = 30

[tool.uv]
package = false
